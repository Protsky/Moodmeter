name: Pubblica su GitHub Pages

# Pubblica il sito sul branch gh-pages, da cui GitHub Pages lo serve su
# https://<utente>.github.io/<repo>/. Gira a ogni push sul branch principale
# del repository, qualunque sia il suo nome.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp -r index.html styles.css sw.js manifest.webmanifest .nojekyll js icons _site/
      - name: Pubblica su gh-pages
        working-directory: _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
